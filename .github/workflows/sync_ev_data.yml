name: Sync Taiwan EV Charging Stations Data

on:
  schedule:
    - cron: '0 19 * * *' # 每天台灣時間 03:00 AM (19:00 UTC) 自動同步
  workflow_dispatch: # 允許在 GitHub 頁面上手動點擊觸發同步

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          npm --prefix scripts install

      - name: Fetch and Sync TDX EV Data
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: |
          node scripts/sync_tdx.js

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stations.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Taiwan EV charging stations dataset [skip ci]" && git push)

      - name: Purge jsDelivr CDN Cache
        run: |
          curl -s https://purge.jsdelivr.net/gh/WiFunworld/taiwan-ev-data@main/data/stations.json || true

